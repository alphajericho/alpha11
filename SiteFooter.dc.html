<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="border-top:1px solid #d2cec6">
  <div style="max-width:1280px;margin:0 auto;padding:48px 20px 40px;display:flex;flex-direction:column;gap:28px">
    <nav aria-label="Social" style="display:flex;flex-wrap:wrap;gap:12px">
      <sc-for list="{{ socials }}" as="s" hint-placeholder-count="3">
        <a href="{{ s.url }}" target="_blank" rel="noopener" aria-label="{{ s.label }}" title="{{ s.label }}" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#1c1d1f;color:#f7f6f3" style-hover="background:#000">
          <sc-if value="{{ s.ig }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg></sc-if>
          <sc-if value="{{ s.fb }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.3H7.9v3h2.6V21h3z"></path></svg></sc-if>
          <sc-if value="{{ s.tt }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 3c.3 2.2 1.6 3.6 3.9 3.8v3.1c-1.4.1-2.6-.3-3.9-1.1v5.8c0 3.6-2.6 6.1-6 6.1-3.3 0-5.8-2.5-5.8-5.7 0-3.6 3-6.1 6.7-5.6v3.2c-1.8-.4-3.4.7-3.4 2.4 0 1.4 1.1 2.5 2.5 2.5 1.6 0 2.6-1 2.6-2.9V3h3.4z"></path></svg></sc-if>
        </a>
      </sc-for>
    </nav>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px;color:#56575a">
      <span>© {{ year }} Alpha Eleven · Bangkok</span>
      <a href="https://bkkdayparties.com" target="_blank" rel="noopener" style="color:#56575a">Day parties: bkkdayparties.com</a>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const socials = (this.props.socials || []).map(s => { const l = (s.label || '').toLowerCase(); return { ...s, ig: l.includes('insta'), fb: l.includes('face'), tt: l.includes('tik') }; });
    return { socials, year: new Date().getFullYear() };
  }
}
</script>
</body>
</html>
