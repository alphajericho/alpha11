<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(231,228,222,0.96);border-bottom:1px solid #d2cec6">
  <div style="max-width:1280px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="Home.dc.html" aria-label="Alpha Eleven home" style="display:block;position:relative;width:118px;height:53px;overflow:hidden;flex:0 0 auto">
      <img src="artwork/alpha-eleven-logo.png" alt="Alpha Eleven" style="position:absolute;width:185px;left:-35px;top:-79px;max-width:none;mix-blend-mode:multiply">
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="display:flex;align-items:center;gap:32px;font-size:14px;letter-spacing:0.1em;text-transform:uppercase">
        <a href="Home.dc.html" style="color:{{ cHome }};text-decoration:none;min-height:44px;display:flex;align-items:center">Home</a>
        <div ref="{{ ddRef }}" style="position:relative">
          <button type="button" onClick="{{ toggleDd }}" aria-expanded="{{ ddExpanded }}" style="background:none;border:0;color:{{ cBrands }};font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;min-height:44px;padding:0;display:flex;align-items:center;gap:8px">Brands <span aria-hidden="true" style="font-size:10px">▾</span></button>
          <sc-if value="{{ ddOpen }}">
            <div style="position:absolute;top:52px;left:-20px;min-width:240px;background:#f7f6f3;border:1px solid #d2cec6;padding:8px 0;display:flex;flex-direction:column">
              <sc-for list="{{ brands }}" as="b" hint-placeholder-count="4">
                <a href="{{ b.href }}" style="color:#1c1d1f;text-decoration:none;padding:12px 20px;text-transform:none;letter-spacing:0.02em;font-size:15px" style-hover="background:#ece9e3">{{ b.name }}</a>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <a href="Tours.dc.html" style="color:{{ cTours }};text-decoration:none;min-height:44px;display:flex;align-items:center">Tours</a>
        <a href="Contact.dc.html" style="color:{{ cContact }};text-decoration:none;min-height:44px;display:flex;align-items:center">Contact</a>
      </nav>
    </sc-if>
    <sc-if value="{{ mobile }}">
      <button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ menuExpanded }}" style="background:none;border:1px solid #a9a59d;color:#1c1d1f;font:inherit;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;min-height:44px;min-width:88px;padding:0 16px;cursor:pointer">{{ menuLabel }}</button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}">
    <nav aria-label="Main" style="position:fixed;top:64px;left:0;right:0;bottom:0;background:#e7e4de;overflow-y:auto;padding:24px 20px 48px;display:flex;flex-direction:column">
      <a href="Home.dc.html" style="color:#1c1d1f;text-decoration:none;font-size:32px;font-weight:500;text-transform:uppercase;padding:14px 0;border-bottom:1px solid #d2cec6">Home</a>
      <div style="padding:14px 0 10px;border-bottom:1px solid #d2cec6;display:flex;flex-direction:column">
        <span style="font-size:32px;font-weight:500;text-transform:uppercase;padding-bottom:6px">Brands</span>
        <sc-for list="{{ brands }}" as="b" hint-placeholder-count="4">
          <a href="{{ b.href }}" style="color:#56575a;text-decoration:none;font-size:20px;padding:10px 0;min-height:44px">{{ b.name }}</a>
        </sc-for>
      </div>
      <a href="Tours.dc.html" style="color:#1c1d1f;text-decoration:none;font-size:32px;font-weight:500;text-transform:uppercase;padding:14px 0;border-bottom:1px solid #d2cec6">Tours</a>
      <a href="Contact.dc.html" style="color:#1c1d1f;text-decoration:none;font-size:32px;font-weight:500;text-transform:uppercase;padding:14px 0;border-bottom:1px solid #d2cec6">Contact</a>
    </nav>
  </sc-if>
</header>
<div aria-hidden="true" style="height:64px"></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: window.innerWidth, menu: false, dd: false };
  ddRef = React.createRef();
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    this.onK = e => { if (e.key === 'Escape') this.setState({ menu: false, dd: false }); };
    this.onDoc = e => { if (this.state.dd && this.ddRef.current && !this.ddRef.current.contains(e.target)) this.setState({ dd: false }); };
    window.addEventListener('resize', this.onR);
    window.addEventListener('keydown', this.onK);
    document.addEventListener('click', this.onDoc);
  }
  componentDidUpdate() { document.body.style.overflow = this.state.menu && this.state.w < 820 ? 'hidden' : ''; }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onR);
    window.removeEventListener('keydown', this.onK);
    document.removeEventListener('click', this.onDoc);
  }
  renderVals() {
    const a = this.props.active, mobile = this.state.w < 820;
    const c = k => (a === k ? '#1c1d1f' : '#56575a');
    return {
      mobile, desktop: !mobile, menuOpen: mobile && this.state.menu, ddOpen: this.state.dd,
      brands: this.props.brands || [], ddRef: this.ddRef,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      toggleDd: () => this.setState(s => ({ dd: !s.dd })),
      ddExpanded: String(this.state.dd), menuExpanded: String(this.state.menu),
      menuLabel: this.state.menu ? 'Close' : 'Menu',
      cHome: c('home'), cBrands: c('brands'), cTours: c('tours'), cContact: c('contact')
    };
  }
}
</script>
</body>
</html>
